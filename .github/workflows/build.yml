name: Build APK

# 触发时机：推送到 main、打 tag、手动点击、或 PR
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 打 tag 创建 Release 需要写权限；其余 job 只读即可
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Platform 34 / Build Tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 运行单元测试
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 打包 Debug + Release
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: SmartTodo-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 打 tag 时创建 Release 并附带 APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
